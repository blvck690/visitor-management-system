services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: vms
      POSTGRES_DB: vms
    ports: ["5432:5432"]
    volumes: [vms_pgdata:/var/lib/postgresql/data]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: [db]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://vms:vms@db:5432/vms?schema=public
    ports: ["4000:4000"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  vms_pgdata: